name: Task3 - Deploy to Kubernetes

on:
  push:
    branches:
      - develop
      - release

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}
      environment: ${{ steps.vars.outputs.env }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set variables based on branch
        id: vars
        run: |
          if [ "${{ github.ref_name }}" == "develop" ]; then
            echo "tag=develop" >> $GITHUB_OUTPUT
            echo "env=dev" >> $GITHUB_OUTPUT
          else
            echo "tag=1.0.0" >> $GITHUB_OUTPUT
            echo "env=prod" >> $GITHUB_OUTPUT
          fi

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/hello-world:${{ steps.vars.outputs.tag }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Get kubeconfig
        run: doctl kubernetes cluster kubeconfig save penina-k8s

      - name: Install Helm
        uses: azure/setup-helm@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy with Helm
        run: |
          helm upgrade --install hello-world ./helm-charts-hello-world \
            -f ./helm-charts-hello-world/values-${{ needs.build-and-push.outputs.environment }}.yaml \
            --set image.tag=${{ needs.build-and-push.outputs.image_tag }}