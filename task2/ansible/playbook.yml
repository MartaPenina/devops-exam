# Ansible playbook - installs Kubernetes (kubectl), Minikube, Helm and dependencies on target VM

---
- name: Install Kubernetes, Minikube, Helm and dependencies
  hosts: nodes
  become: true
  vars:
    node_ip: "{{ node_ip }}"

  tasks:
    # Install system dependencies
    - name: Install required system packages
      apt:
        name:
          - curl
          - wget
          - apt-transport-https
          - ca-certificates
          - gnupg
          - conntrack
          - socat
        state: present
        update_cache: yes

    # Install kubectl
    - name: Download kubectl binary
      get_url:
        url: https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl
        dest: /usr/local/bin/kubectl
        mode: '0755'

    - name: Verify kubectl installation
      command: kubectl version --client
      register: kubectl_version
      changed_when: false

    # Install Minikube
    - name: Download Minikube binary
      get_url:
        url: https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
        dest: /usr/local/bin/minikube
        mode: '0755'

    - name: Verify Minikube installation
      command: minikube version
      register: minikube_version
      changed_when: false

    # Install Helm
    - name: Download Helm install script
      get_url:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        dest: /tmp/get-helm-3.sh
        mode: '0755'

    - name: Install Helm
      command: /tmp/get-helm-3.sh
      args:
        creates: /usr/local/bin/helm

    - name: Verify Helm installation
      command: helm version
      register: helm_version
      changed_when: false

    # Start Minikube
    - name: Start Minikube with none driver
      command: minikube start --driver=none --force
      environment:
        MINIKUBE_WANTUPDATENOTIFICATION: "false"
      ignore_errors: yes

    # Enable Minikube dashboard
    - name: Enable Minikube dashboard addon
      command: minikube addons enable dashboard
      ignore_errors: yes

    - name: Enable Minikube metrics-server addon
      command: minikube addons enable metrics-server
      ignore_errors: yes