# Ansible playbook - installs Kubernetes (kubectl), Minikube, Helm and dependencies on target VM

---
- name: Install Kubernetes, Minikube, Helm and dependencies
  hosts: nodes
  become: true
  vars:
    node_ip: "{{ node_ip }}"

  tasks:
    # Install system dependencies
    - name: Install required system packages
      apt:
        name:
          - curl
          - wget
          - apt-transport-https
          - ca-certificates
          - gnupg
          - conntrack
          - socat
        state: present
        update_cache: yes

    # Install Docker
    - name: Install Docker dependencies
      apt:
        name:
          - ca-certificates
          - curl
        state: present

    - name: Add Docker GPG key
      shell: |
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
        chmod a+r /etc/apt/keyrings/docker.asc
      args:
        creates: /etc/apt/keyrings/docker.asc

    - name: Add Docker repository
      shell: |
        echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable" > /etc/apt/sources.list.d/docker.list
      args:
        creates: /etc/apt/sources.list.d/docker.list

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: yes

    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    # Install crictl
    - name: Download and install crictl
      shell: |
        curl -L https://github.com/kubernetes-sigs/cri-tools/releases/download/v1.35.0/crictl-v1.35.0-linux-amd64.tar.gz | tar -xz -C /usr/local/bin/
      args:
        creates: /usr/local/bin/crictl

    # Install kubectl
    - name: Download kubectl binary
      get_url:
        url: https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl
        dest: /usr/local/bin/kubectl
        mode: '0755'
        force: yes

    - name: Verify kubectl installation
      command: kubectl version --client
      register: kubectl_version
      changed_when: false

    # Install Minikube
    - name: Download Minikube binary
      get_url:
        url: https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
        dest: /usr/local/bin/minikube
        mode: '0755'

    - name: Verify Minikube installation
      command: minikube version
      register: minikube_version
      changed_when: false

    # Install Helm
    - name: Download Helm install script
      get_url:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        dest: /tmp/get-helm-3.sh
        mode: '0755'

    - name: Install Helm
      command: /tmp/get-helm-3.sh
      args:
        creates: /usr/local/bin/helm

    - name: Verify Helm installation
      command: helm version
      register: helm_version
      changed_when: false

    # Start Minikube
    - name: Start Minikube with docker driver
      command: minikube start --driver=docker --force
      environment:
        MINIKUBE_WANTUPDATENOTIFICATION: "false"
      ignore_errors: yes

    # Enable Minikube addons
    - name: Enable Minikube dashboard addon
      command: minikube addons enable dashboard
      ignore_errors: yes

    - name: Enable Minikube metrics-server addon
      command: minikube addons enable metrics-server
      ignore_errors: yes